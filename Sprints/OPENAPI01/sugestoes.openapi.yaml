
openapi: 3.0.3

info:
  title: API de Sugestões dos Alunos
  version: 1.0.0
  description: API para submeter sugestões, acompanhar o seu tratamento e consultar estatísticas.

servers:
  - url: https://api.estgv.exemplo/v1

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Estado'
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: tamanhoPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Lista de sugestões que cumprem os filtros.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sugestão encontrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                titulo: 'Melhorar a biblioteca'
                descricao: 'Proponho alargar o horário da biblioteca durante a época de exames.'
                categoria: instalacoes
                numeroAluno: '12345'
                id: 12
                estado: aceite
                dataCriacao: '2026-10-01T10:00:00Z'
                dataAtualizacao: '2026-10-10T15:30:00Z'
                dataResolucao: null
        '304':
          description: A sugestão não foi modificada desde a versão indicada pelo cliente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/Erro404'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão atualizada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/ConflitoEdicao'
        '412':
          $ref: '#/components/responses/Erro412'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Sugestão retirada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/ConflitoRetirada'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Histórico de acompanhamento da sugestão.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivado'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '404':
          $ref: '#/components/responses/Erro404'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          $ref: '#/components/responses/Erro400'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/ConflitoEstado'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      parameters:
        - name: anoLetivo
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      responses:
        '200':
          description: Estatísticas de resolução do ano letivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: '2026-2027'
                totalSugestoes: 40
                porEstado:
                  submetida: 5
                  em_analise: 8
                  aceite: 10
                  rejeitada: 7
                  resolvida: 10
                taxaResolucao: 0.25
                tempoMedioResolucaoDias: 12.5
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      parameters:
        - name: anoLetivo
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      responses:
        '200':
          description: Estatísticas agrupadas por categoria.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        '400':
          $ref: '#/components/responses/Erro400'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      responses:
        '200':
          description: Lista das categorias disponíveis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheCategorias'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          $ref: '#/components/responses/ErroPorOmissao'

components:
  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra

    Categoria:
      type: object
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      required:
        - codigo
        - descricao

    SugestaoNova:
      type: object
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
        numeroAluno:
          type: string
          pattern: '^[0-9]{5,8}$'
      required:
        - titulo
        - descricao
        - categoria
        - numeroAluno

    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estado:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true
          required:
            - id
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao

    AcompanhamentoNovo:
      type: object
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
        responsavel:
          type: string
          pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'
          minLength: 5
          maxLength: 60
      required:
        - novoEstado
        - nota
        - responsavel

    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estadoAnterior:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true
          required:
            - id
            - estadoAnterior
            - data

    ListaSugestoes:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Sugestao'
          maxItems: 50
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens

    EstatisticasResolucao:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias

    EstatisticasCategorias:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              categoria:
                $ref: '#/components/schemas/CodigoCategoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
      required:
        - anoLetivo
        - categorias

    Erro:
      type: object
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
            required:
              - campo
              - problema
      required:
        - codigo
        - mensagem

  parameters:
    id:
      name: id
      in: path
      required: true
      description: Identificador positivo da sugestão.
      schema:
        type: integer
        minimum: 1

  responses:
    Erro400:
      description: Pedido inválido, parâmetros incorretos ou dados que não cumprem as regras de validação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Erro404:
      description: A sugestão ou o recurso solicitado não existe.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflitoEdicao:
      description: A sugestão já não está no estado submetida, pelo que não pode ser editada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflitoRetirada:
      description: A sugestão já não está no estado submetida, pelo que não pode ser retirada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflitoEstado:
      description: A mudança de estado não respeita as transições permitidas. De submetida só pode passar a em_analise; de em_analise pode passar a aceite ou rejeitada; de aceite pode passar a resolvida. Rejeitada e resolvida são estados finais.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Erro412:
      description: O valor de If-Match não corresponde à versão atual da sugestão.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ErroPorOmissao:
      description: Ocorreu um erro não especificado nesta operação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  headers:
    CacheCategorias:
      description: As categorias podem ser guardadas em cache durante 24 horas.
      schema:
        type: string
        enum:
          - 'public, max-age=86400'

    CacheEstatisticas:
      description: As estatísticas podem ser guardadas em cache durante uma hora.
      schema:
        type: string
        enum:
          - 'public, max-age=3600'

    CachePrivado:
      description: Resposta privada que exige revalidação antes de reutilização.
      schema:
        type: string
        enum:
          - 'private, no-cache'

    CacheNoStore:
      description: A resposta não deve ser armazenada em cache.
      schema:
        type: string
        enum:
          - 'no-store'

    ETag:
      description: Identificador da versão atual da representação.
      schema:
        type: string

    Location:
      description: URL da sugestão criada.
      schema:
        type: string
        format: uri
